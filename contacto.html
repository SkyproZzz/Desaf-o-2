<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contacto</title>
        <link rel="stylesheet" href="./css/styles.css">
        <link rel="shortcut icon" href="./assets/Icons/web-development.png">
    </head>
    <body>
        <header>
            <h1><img src="./assets/icons/Home.svg">Tecnología de la información</h1>
            <h2><img src="./assets/icons/World.svg">Desafío 6</h2>
            <h3><img src="./assets/icons/Framework.svg">Diseño Web</h3>
            <h4><img src="./assets/icons/PC.svg"> Lionel Gramaglia</h4>
        </header>
        <nav>
                <ul>
                    <li><a href="./index.html"> Inicio </a></li>
                </ul>
        </nav>

        <section class="formulario">
            <h2 class="Contacte">Contacte con nosotros</h2>

            <form name="formulario" method="POST" action="">

                <label for="nombre">Nombre y Apellido</label>
                <input type="text" name="nombre" id="nombre" placeholder="Ingrese su nombre" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" name="correo" id="correo" placeholder="ingrese su correo electrónico" required>

                <label for="telefono">Teléfono</label>
                <input type="tel" name="telefono" id="telefono" placeholder="ingrese su teléfono" required>

                <label for="carrera">Carrera</label>
                <input type="text" name="carrera" id="carrera" placeholder="ingrese su carrera" required>

                <label for="msg">Mensaje</label>
                <textarea name="msg" id="msg" placeholder="deje su mensaje aquí..." rows="7"></textarea>

                <button type="submit" class="guardar">Enviar</button>
                <button type="reset" class="cancelar">Cancelar</button>
            </form>
        </section>
        <footer>
            <h5>Diseñado por: Lionel Gramaglia</h5>
            <p>&copy; 2026 Lionel Gramaglia. Todos los derechos reservados.</p>
        </footer>
    </body>
</html>
